name: interviewai
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.7+32

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter

  # Camera & Media
  camera: ^0.10.5+5
  audioplayers: ^6.5.0
  just_audio: ^0.9.44

  # Speech & TTS
  speech_to_text: ^7.0.0
  flutter_tts: ^3.8.5

  # Networking
  url_launcher: 6.2.5
  firebase_storage: ^12.3.0
  http: ^1.1.0
  googleapis: ^11.4.0
  googleapis_auth: ^1.4.1

  # Firebase (upgraded to ^3.x for web ^1.0.0 compatibility)
  firebase_core: ^3.6.0
  firebase_app_check: ^0.3.1
  firebase_auth: ^5.3.0
  firebase_messaging: ^15.1.3
  firebase_remote_config: ^5.1.0
  cloud_functions: ^5.1.0
  google_generative_ai: ^0.4.6
  cloud_firestore: ^5.4.0
  firebase_analytics: ^11.5.0
  firebase_crashlytics: ^4.3.5

  # Auth
  google_sign_in: ^6.2.0

  # Notifications
  flutter_local_notifications: ^19.3.0
  timezone: ^0.10.1

  # Purchases
  in_app_purchase: ^3.2.3
  in_app_purchase_android: ^0.5.0
  in_app_purchase_storekit: ^0.4.2
  purchases_flutter: ^8.10.6

  # ML & Detection
  google_mlkit_face_detection: ^0.13.1

  # Storage & Files
  shared_preferences: ^2.5.3
  path_provider: ^2.1.5
  pdf: ^3.11.3
  share_plus: ^10.0.0

  # Audio recording (for cloud transcription)
  record: ^6.2.1
  web_socket_channel: ^3.0.1

  # Permissions & UI
  permission_handler: ^11.0.1
  cupertino_icons: ^1.0.8

  file_picker: ^8.1.2
  archive: ^3.6.1
  in_app_review: ^2.0.9
  device_info_plus: ^12.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
