# Codemagic: builds ITSAGO for iOS on a cloud Mac and uploads it to TestFlight.
# Uses the SAVED signing files in Codemagic (Team settings > Code signing
# identities): certificate "itsago_distribution" + profile "itsago_app_store".
# Codemagic never creates new certificates (Apple allows only 2).
# Integration (Team settings > Integrations > Developer Portal): "ITSAGO ASC Key"
workflows:
  ios-release:
    name: iOS release (TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: ITSAGO ASC Key
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.itsago.interviewai
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Install pods
        script: find . -name "Podfile" -execdir pod install \;
      - name: Use saved signing files
        script: xcode-project use-profiles
      - name: Build IPA
        script: |
          flutter build ipa --release \
            --build-number=$((BUILD_NUMBER + 100)) \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        # Upload to TestFlight for internal testers only (no external beta review)
        submit_to_testflight: false
